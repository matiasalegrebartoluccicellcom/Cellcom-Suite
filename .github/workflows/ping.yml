name: Ping Supabase (anti-pausa)

on:
  schedule:
    - cron: '17 12 * * *'   # todos los días 09:17 hora Argentina
  workflow_dispatch:         # botón para correrlo a mano

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/sucursales?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
          echo "OK"
