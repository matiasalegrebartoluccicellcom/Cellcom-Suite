<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CELLCOM Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header>
      <a class="logo" href="#/"><b>CELLCOM</b><i></i><span>SUITE</span></a>
      <div class="der">
        <button class="bell oculto" id="bell" onclick="togglePanel()" aria-label="Notificaciones"></button>
        <i class="div oculto" id="divBell"></i>
        <div class="perfil" id="perfil"></div>
      </div>
    </header>

    <div id="panel"></div>
    <main id="main"></main>
  </div>

  <!-- Login: aparece solo al entrar a una Suite -->
  <div id="modal" class="oculto" onclick="if(event.target===this)cerrarLogin()">
    <div class="box">
      <button class="cerrar" onclick="cerrarLogin()" aria-label="Cerrar">×</button>
      <div class="logo grande"><b>CELLCOM</b><i></i><span>SUITE</span></div>
      <p id="mTexto">Ingresá con tu usuario</p>
      <form id="fLogin" onsubmit="login(event)">
        <input id="lUsuario" type="text" placeholder="Usuario" autocomplete="username"
               autocapitalize="none" autocorrect="off" spellcheck="false" required>
        <input id="lPass" type="password" placeholder="Contraseña" autocomplete="current-password" required>
        <div id="lError" class="error oculto"></div>
        <button class="btnPri" id="lBtn" type="submit">Ingresar</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
